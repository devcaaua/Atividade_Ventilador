<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Controle do Ventilador</title>
</head>
<body>
    
    <h1>Controle do Ventilador</h1>

    <div class="container">
        
        <div class="ventilador">
            <div class="grade" id="grade-ventilador">
                <div class="helice helice1"></div>
                <div class="helice helice2"></div>
                <div class="helice helice3"></div>
            </div>
        </div>

        
        <p id="status">Status: Desligado</p>

        
        <button id="botao">Ligar</button>

        
        <div class="velocidades">
            <p>Velocidade:</p>
            <button class="btn-vel" id="btn-v1">1</button>
            <button class="btn-vel" id="btn-v2">2</button>
            <button class="btn-vel" id="btn-v3">3</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
